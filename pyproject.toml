[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-ascend-simllm"
version = "0.1.0.dev0"
description = "SimLLM task-similarity KV reuse plugin for vLLM Ascend"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "torch>=2.5", "vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.simllm" = "vllm_ascend_simllm"

[project.entry-points."vllm.general_plugins"]
simllm = "vllm_ascend_simllm.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_ascend_simllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and runs a transformer model"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
