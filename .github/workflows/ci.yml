name: SimLLM package checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test tools
        run: python -m pip install pytest ruff
      - name: Lint
        run: ruff check src tests benchmarks/verify_wheel_lifecycle.py benchmarks/verify_host_lifecycle.py benchmarks/verify_inference_rollback.py
      - name: Format
        run: ruff format --check src tests benchmarks/verify_wheel_lifecycle.py benchmarks/verify_host_lifecycle.py benchmarks/verify_inference_rollback.py
      - name: Configuration and activation tests
        run: PYTHONPATH=src python -m pytest -q tests/test_config.py tests/test_plugin.py tests/test_compatibility.py tests/test_inference_rollback.py
      - name: Clean-wheel lifecycle
        run: python benchmarks/verify_wheel_lifecycle.py
