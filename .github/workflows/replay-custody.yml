name: Replay custody
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: ruff check scripts/fetch_benchmark_replay.py tests/test_evidence_custody.py
      - run: ruff format --check scripts/fetch_benchmark_replay.py tests/test_evidence_custody.py
      - run: python -m pytest -q tests/test_evidence_custody.py
      - run: python scripts/fetch_benchmark_replay.py "$RUNNER_TEMP/simllm-replay"
